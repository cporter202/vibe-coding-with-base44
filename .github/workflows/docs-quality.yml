name: Docs Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'https://www.ftc.gov/.*'
            --exclude 'https://base44.pxf.io/.*'
            './**/*.md'
          fail: true

      - name: Check affiliate redirect
        shell: bash
        run: |
          status=$(curl --location --silent --show-error \
            --output /dev/null --write-out "%{http_code}" --max-redirs 10 \
            "https://base44.pxf.io/c/6763812/2049275/25619?subId1=github&trafcat=base")
          test "$status" -ge 200 -a "$status" -lt 400
